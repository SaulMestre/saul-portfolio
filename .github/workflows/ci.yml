name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Restore locked dependencies
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage
      - name: Retain frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Capture production shell performance
        run: npx playwright test --config playwright.performance.config.ts
      - name: Retain performance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-foundation-performance
          path: frontend/test-results/performance/
          if-no-files-found: error
          retention-days: 30
      - name: Verify frontend gates reject invalid fixtures
        run: python3 ../scripts/verify_quality_gates.py frontend
      - name: Audit dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
      - name: Require committed lock
        if: ${{ !cancelled() }}
        run: git ls-files --error-unmatch package-lock.json
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore backend/Portfolio.slnx --locked-mode
      - run: dotnet build backend/Portfolio.slnx --no-restore --configuration Release
      - name: Test backend and collect application coverage
        run: dotnet test backend/Portfolio.slnx --no-build --configuration Release --collect "Code Coverage;Format=Cobertura" --settings backend/coverage.runsettings --results-directory "${{ runner.temp }}/backend-coverage"
      - name: Summarize backend coverage
        run: python3 scripts/report_backend_coverage.py "${{ runner.temp }}/backend-coverage"
      - name: Retain backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/backend-coverage/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 7
      - name: Verify backend test gate rejects invalid fixture
        run: python3 scripts/verify_quality_gates.py backend
      - name: Require committed locks
        run: |
          for project in $(find backend -name '*.csproj'); do
            git ls-files --error-unmatch "$(dirname "$project")/packages.lock.json"
          done

  spec-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify official Spec Kit files and isolated feature workflow
        run: python3 scripts/verify_spec_kit.py

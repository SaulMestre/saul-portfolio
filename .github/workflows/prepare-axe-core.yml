name: Prepare accessibility dependency
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == '003-visual-foundation-showcase'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Generate exact development dependency lock
        run: npm install --package-lock-only --save-dev --save-exact --ignore-scripts axe-core@4.14.1
      - name: Validate lock and audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          node -e 'const p=require("./package.json");const l=require("./package-lock.json");if(p.devDependencies["axe-core"]!=="4.14.1"||l.packages["node_modules/axe-core"].license!=="MPL-2.0")process.exit(1)'
      - name: Retain generated package manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-core-lock-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
